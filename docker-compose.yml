services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: sh -c 'if [ -n "$REDIS_PASSWORD" ]; then exec redis-server --save 60 1 --loglevel warning --requirepass "$REDIS_PASSWORD"; else exec redis-server --save 60 1 --loglevel warning; fi'
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    # Qdrant is ready when REST returns from /collections.
    # Avoid /readyz (missing on several tags) to prevent false "unhealthy".
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/collections >/dev/null 2>&1 || curl -fsS http://localhost:6333/collections >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASS:-s3cr3t}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASS=${NEO4J_PASS:-s3cr3t}
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u "$NEO4J_USER" -p "$NEO4J_PASS" "RETURN 1"']
      interval: 10s
      timeout: 10s
      retries: 6

  ai-app:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend:latest
    command: uvicorn ai_org_backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - QDRANT_URL=http://qdrant:6333
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME="Tim Mergenthaler"
      - WORKSPACE_DIR=/app/workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        # Do not block the whole stack on a strict Qdrant healthcheck.
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../workspace:/app/workspace

  orchestrator:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend:latest
    working_dir: /app/backend/ai_org_backend  # <- Hinzufügen
    command: >
      /bin/sh -c "alembic upgrade head && python -m ai_org_backend.orchestrator.scheduler"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - QDRANT_URL=http://qdrant:6333
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME="Tim Mergenthaler"
      - WORKSPACE_DIR=/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        # Do not block the whole stack on a strict Qdrant healthcheck.
        condition: service_started
    volumes:
      - ../workspace:/app/workspace

  celery-architect:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend:latest
    command: celery -A ai_org_backend.tasks.celery_app:app worker --loglevel=INFO
    environment:
      - WORKER_GROUP=architect
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - QDRANT_URL=http://qdrant:6333
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
      - WORKSPACE_DIR=/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../workspace:/app/workspace

  celery-insight:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend:latest
    command: celery -A ai_org_backend.tasks.celery_app:app worker --loglevel=INFO
    environment:
      - WORKER_GROUP=insight
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - QDRANT_URL=http://qdrant:6333
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
      - WORKSPACE_DIR=/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../workspace:/app/workspace

  celery-dev:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend:latest
    command: celery -A ai_org_backend.tasks.celery_app:app worker --loglevel=INFO
    environment:
      - WORKER_GROUP=dev
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - QDRANT_URL=http://qdrant:6333
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME="Tim Mergenthaler"
      - API_BASE_URL=http://ai-app:8000
      - UI_BASE_URL=http://frontend
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
      - WORKSPACE_DIR=/app/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - ../workspace:/app/workspace

  celery-exporter:
    image: danihodovic/celery-exporter:latest
    environment:
      - CE_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "9808:9808"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ai-app
      - celery-exporter

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
    image: local/ai_frontend:latest
    ports:
      - "5173:80"
    depends_on:
      ai-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./logs/nginx:/var/log/nginx

  test-runner:
    build:
      context: .
      dockerfile: backend/ai_org_backend/Dockerfile
      target: test
    image: local/ai_backend:test
    command: >
      /bin/sh -c "sleep 5 && python -c \"from playwright.sync_api import sync_playwright; p=sync_playwright().start(); browser=p.chromium.launch(); page=browser.new_page(); page.goto('http://frontend'); content=page.content(); browser.close(); p.stop(); import sys; sys.exit(0 if 'DOCTYPE html' in content else 1)\""
    depends_on:
      frontend:
        condition: service_healthy
      ai-app:
        condition: service_healthy
    profiles: ["test"]

volumes:
  pgdata:
  neo4j_data:
  qdrant_storage:
  prometheus_data:
  grafana_data:
