services:
  # ───────────── Datenbanken ─────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command: sh -c 'if [ -n "$REDIS_PASSWORD" ]; then exec redis-server --save 60 1 --loglevel warning --requirepass "$REDIS_PASSWORD"; else exec redis-server --save 60 1 --loglevel warning; fi'
    ports: ["6379:6379"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", 'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping; else redis-cli ping; fi']
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASS:-s3cr3tP@ss}
      #- NEO4J_USER=${NEO4J_USER:-neo4j}
      #- NEO4J_PASS=${NEO4J_PASS:-s3cr3tP@ss}
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # Browser UI
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'cypher-shell -u "$NEO4J_USER" -p "$NEO4J_PASS" "RETURN 1"']
      interval: 10s
      timeout: 10s
      retries: 6

  # ───────────── Celery-Worker ───────────
  celery-architect:
    build:
      context: ..
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend_architect:latest
    env_file:
      - ../.env
    command: >
      sh -c "celery -A ai_org_backend.tasks.celery_app worker \
             -Q ${TENANT}:architect \
             -l INFO -P solo"
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_APP=ai_org_backend.tasks.celery_app
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME=Tim Mergenthaler
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  celery-insight:
    build:
      context: ..
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend_insight:latest
    env_file:
      - ../.env
    command: >
      celery -A ai_org_backend.tasks.celery_app worker
             -Q ${TENANT}:insight
             -l INFO -P solo
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_APP=ai_org_backend.tasks.celery_app
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME=Tim Mergenthaler
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  celery-dev:
    build:
      context: ..
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend_dev:latest
    env_file:
      - ../.env
    command: >
      celery -A ai_org_backend.tasks.celery_app worker
             -Q ${TENANT}:dev,${TENANT}:qa,${TENANT}:ux_ui,${TENANT}:telemetry
             -l INFO -P solo
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - CELERY_APP=ai_org_backend.tasks.celery_app
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME=Tim Mergenthaler
      - API_BASE_URL=http://ai-app:8000
      - UI_BASE_URL=http://frontend
      - CELERY_WORKER_SEND_TASK_EVENTS=true
      - CELERY_TASK_SEND_SENT_EVENT=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  # ───────────── Application ───────────
  ai-app:
    build:
      context: ..
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend_app:latest
    env_file:
      - ../.env
    command: uvicorn ai_org_backend.main:app --host 0.0.0.0 --port 8000
    # Helpful for quick checks if envs are loaded
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      - GIT_AUTHOR_NAME=ai-org-bot
      - GIT_AUTHOR_EMAIL=noreply@ai.org
      - GIT_COMMITTER_NAME=ai-org-bot
      - GIT_COMMITTER_EMAIL=noreply@ai.org
      - WORKSPACE_DIR=/app/workspace
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME=Tim Mergenthaler
    ports:
        - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ../workspace:/app/workspace

  orchestrator:
    build:
      context: ..
      dockerfile: backend/ai_org_backend/Dockerfile
      target: prod
    image: local/ai_backend_orchestrator:latest
    env_file:
      - ../.env
    working_dir: /app/backend/ai_org_backend  # Im Arbeitsverzeichnis mit alembic.ini
    command: >
      /bin/sh -c "alembic upgrade head && python -m ai_org_backend.orchestrator.scheduler"
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASS=${NEO4J_PASS}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - QDRANT_URL=http://qdrant:6333
      # explizit injizieren – garantiert, auch ohne env_file
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKSPACE_DIR=/app/workspace
      - TENANT=a865fa25-3794-410f-9bce-0be47b467f74
      - TENANT_NAME=Tim Mergenthaler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
       - ../workspace:/app/workspace
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    restart: unless-stopped
    environment:
      - CE_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "9808:9808"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ai-app
      - celery-exporter

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  frontend:
    build:
      # Nur das Frontend als Kontext schicken (schneller & stabiler)
      context: ../frontend
      dockerfile: Dockerfile
    image: local/ai_frontend:latest
    profiles: ["ui"]
    ports:
      - "5732:80"
    depends_on:
      ai-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ../logs/nginx:/var/log/nginx

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/collections >/dev/null 2>&1 || curl -fsS http://localhost:6333/collections >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  neo4j_data:
  qdrant_storage:
  prometheus_data:
  grafana_data:
