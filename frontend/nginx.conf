# This file is included within the HTTP context of the official nginx image configuration.
# Therefore directives like 'map' may appear above the 'server' blocks.

# WebSocket/HTTP upgrade handling (harmless even if unused)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Docker embedded DNS (resolves container hosts): re-resolve every 10s
resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name _;

  # Static files (single-page apps, exported Next/Vite/CRA builds)
  root   /usr/share/nginx/html;
  index  index.html;

  # Compose service name of backend (NOT container name)
  set $api_upstream ai-app:8000;

  # Gzip basic
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # For SPA: fall back all routes to index.html (if present)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Redirect /api without slash to /api/ (prevents SPA fallback to index.html on POST)
  location = /api { return 308 /api/; }

  # Cache for static assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # Forward API routes to FastAPI backend
  location /api/ {
    proxy_pass http://$api_upstream;  # dynamic name resolution via resolver
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_next_upstream error timeout http_502 http_503 http_504;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
  # Forward WebSocket routes to FastAPI backend (upgrade required)
  location /ws/ {
    proxy_pass http://$api_upstream;  # proxy WS to backend
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;
  }
}
