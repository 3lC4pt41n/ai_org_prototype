# Dieses File wird in der offiziellen nginx-Image-Konfiguration innerhalb des HTTP-Kontextes inkludiert.
# Darum dürfen hier Direktiven wie 'map' oberhalb der 'server'‑Blöcke stehen.

# WebSocket/HTTP Upgrade Handling (ungefährlich, auch wenn ungenutzt)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;

  # Statische Files (Single-Page-Apps, exportierte Next/Vite/CRA Builds)
  root   /usr/share/nginx/html;
  index  index.html;

  # Gzip basic
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;
  gzip_min_length 1024;

  # Für SPA: alle Routen auf index.html zurückfallen lassen (falls vorhanden)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api ohne Slash sauber auf /api/ umleiten (verhindert SPA-Fallback auf index.html bei POST)
  location = /api { return 308 /api/; }

  # Cache für statische Assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # API-Routen an das FastAPI-Backend weiterleiten
  location /api/ {
    proxy_pass http://ai-app:8000;  # Compose-Service-Name (DNS im Compose-Netz), NICHT der Container-Name
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }
}
