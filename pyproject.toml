[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
# Wähle gängige Regel-Sets; wir können später schärfer stellen.
select = ["E", "F", "W", "I"]
ignore = []
target-version = "py311"

[tool.poetry.dependencies]
# (bestehende Einträge unverändert lassen)
python-multipart = "^0.0.9"
backoff = "^2.2.1"
PyJWT = "^2.8.0"
# stellt das Modulpfad-Target "lxml.html.clean" für readability bereit
lxml_html_clean = "^0.2.0"
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
