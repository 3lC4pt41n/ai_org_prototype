[mypy]
python_version = 3.11
warn_unused_configs = True
check_untyped_defs = True
disallow_untyped_defs = False
ignore_missing_imports = True
namespace_packages = True

# Wir prüfen gezielt unser Backend-Paket.
[mypy-ai_org_backend.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-openai.*]
ignore_missing_imports = True
