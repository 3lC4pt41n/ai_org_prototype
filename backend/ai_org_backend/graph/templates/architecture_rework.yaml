  "edges": [
    {"source": "load_current", "target": "impact_analysis"},
    {"source": "impact_analysis", "target": "revise_architecture"},
    {"source": "revise_architecture", "target": "review"},
    {"source": "review", "target": "revise_architecture", "edge_type": "feedback", "condition": "review_score < 0.85"},
    {"source": "review", "target": "invalidate_downstream", "condition": "review_score >= 0.85"},
    {"source": "invalidate_downstream", "target": "publish"}
  ],
