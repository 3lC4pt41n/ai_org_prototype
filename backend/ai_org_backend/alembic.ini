# alembic.ini — Root deiner Repo (empfohlen)
[alembic]
# Path relativ zu diesem .ini-File
script_location = alembic


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# --- DB-URL wird über die Umgebung konfiguriert; kein fixer Wert im Repo.
