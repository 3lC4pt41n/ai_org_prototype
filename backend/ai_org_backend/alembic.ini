[alembic]
# Relativ zur INI-Datei
script_location = %(here)s/alembic

# sqlalchemy.url wird bewusst NICHT hart verdrahtet.
# Wir lesen bevorzugt DATABASE_URL aus der Umgebung (siehe env.py).
# Optional: Du kannst hier eine Default-URL eintragen, falls du willst:
# sqlalchemy.url = postgresql+psycopg2://postgres:postgres@postgres:5432/postgres

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic
