[project]
name = "ai_org_backend"
version = "0.1.0"
description = "AI‑Org backend"
authors = [{ name = "Your Org" }]
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "sqlmodel",
  "celery",
  "redis",
  "neo4j",
  "prometheus-client",
  "pydantic-settings",
  "python-dotenv",
  "jinja2",
  "jsonschema>=4.0.0",
  "networkx",
  "qdrant-client",
  "openai==1.40.0",
  "httpx[http2]==0.27.2",
  "backoff>=2.2.1,<3.0",
  "PyJWT",
  "python-multipart>=0.0.9",
  "psycopg2-binary",
  "uvicorn",
  "alembic",
  "beautifulsoup4>=4.12.3",
  "duckduckgo-search>=5.3.1",
  "lxml>=5.2.2",
  "readability-lxml>=0.8.1",
  "lxml_html_clean>=0.2.0,<0.3",
  "passlib[bcrypt]==1.7.4",
  "bcrypt<4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "bandit",
    "pip-audit",
    "playwright",
    "pytest-playwright",
    "locust",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
    "mypy",
    "types-requests",
    "isort",
    "pre-commit",
    "requests-mock",
    "requests"
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
