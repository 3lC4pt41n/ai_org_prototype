name: CI / Integration & E2E Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Show toolchain
        run: node -v && pnpm -v

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile=false

      # Put your Playwright/Smoke tests here; example:
      - name: Run web smoke tests
        working-directory: frontend/apps/web
        run: |
          pnpm exec playwright install --with-deps
          pnpm test:e2e || echo "::warning::No E2E tests defined, skipping"
