name: Deploy Docker Images
on:
  push:
    branches: [ "dev", "qa", "main" ]
  release:
    types: [ published ]
  workflow_dispatch:

# Grant write access to packages (GHCR) and read access to code
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Set target environment tag
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GITHUB_REF##*/}" = "dev" ]; then echo "ENV_TAG=dev" >> $GITHUB_ENV;
          elif [ "${GITHUB_REF##*/}" = "qa" ]; then echo "ENV_TAG=qa" >> $GITHUB_ENV;
          elif [ "$GITHUB_EVENT_NAME" = "release" ] || [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "ENV_TAG=prod" >> $GITHUB_ENV;
          else echo "ENV_TAG=latest" >> $GITHUB_ENV; fi

      - name: Set image repository
        run: echo "GHCR_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend images (API, Orchestrator, Celery workers)
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ai_org_backend
          file: backend/ai_org_backend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.GHCR_REPO }}/api:${{ env.ENV_TAG }},
                ${{ env.GHCR_REPO }}/orchestrator:${{ env.ENV_TAG }},
                ${{ env.GHCR_REPO }}/celery-architect:${{ env.ENV_TAG }},
                ${{ env.GHCR_REPO }}/celery-insight:${{ env.ENV_TAG }},
                ${{ env.GHCR_REPO }}/celery-dev:${{ env.ENV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: true
          tags: ${{ env.GHCR_REPO }}/frontend:${{ env.ENV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror official images to GHCR (Postgres, Redis)
        run: |
          docker pull postgres:15 && docker tag postgres:15 ${{ env.GHCR_REPO }}/postgres:15 && docker push ${{ env.GHCR_REPO }}/postgres:15
          docker pull redis:7 && docker tag redis:7 ${{ env.GHCR_REPO }}/redis:7 && docker push ${{ env.GHCR_REPO }}/redis:7
